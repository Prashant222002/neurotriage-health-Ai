<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>NeuroTriage Admin</title>
<style>
:root{--bg:#0b1220;--sf:#131d33;--bd:#243556;--tx:#eef4ff;--mut:#94a7c6;--pri:#14b8a6;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.w{max-width:520px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}label:first-child{margin-top:0}
input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--bd);background:#0b1220;color:var(--tx);padding:0 14px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.seg button,.chips button{min-height:46px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;font-weight:700}
.seg button.on,.chips button.on{background:var(--pri);border-color:transparent;color:#04211f}
.chips button{flex:0 0 auto;min-width:64px;padding:0 12px}
.go{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#6366f1);color:#fff;font-size:17px;font-weight:800}
.go:disabled{opacity:.5}.ghost{min-height:40px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:0 12px}
.msg{margin-top:10px;font-size:14px;min-height:20px;overflow-wrap:anywhere}.ok{color:var(--pri)}.er{color:var(--bad)}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.it:first-child{border-top:0}
.it .i{flex:1;min-width:0}.it b{display:block;overflow-wrap:anywhere}.it span{font-size:12.5px;color:var(--mut)}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#6366f133;color:#c7d2fe}.tag.t2{background:#f59e0b33;color:#fde68a}
.hid{display:none}
</style></head><body><div class="w">
<h1>NeuroTriage Admin</h1><p class="sub">Email ke hisaab se plan free dena ya wapas lena</p>
<div class="msg" id="sv" style="margin:0 0 12px">Server check ho raha hai...</div>

<div class="card" id="s1"><p style="margin:0 0 12px">Step 1: admin Google account se login karein.</p>
<button class="go" id="gl" style="margin:0">Google se login</button><div class="msg er" id="e1"></div></div>

<div class="card hid" id="s2"><p style="margin:0 0 4px">Step 2: admin password</p><p class="sub" id="who" style="word-break:break-all"></p>
<input type="password" id="pw" autocomplete="off" placeholder="Password"><button class="go" id="pg">Aage badhein</button>
<div class="row" style="margin-top:10px"><button class="ghost" id="so1">Dusra account</button></div><div class="msg er" id="e2"></div></div>

<div id="panel" class="hid">
<div class="card"><div class="row" style="align-items:center"><span id="who2" class="sub" style="margin:0;word-break:break-all"></span><button class="ghost" id="so" style="flex:0 0 auto">Logout</button></div></div>
<div class="card">
<label for="em">User ka email (jis se wo app me login karta hai)</label>
<input type="email" id="em" autocomplete="off" autocapitalize="off" placeholder="name@gmail.com">
<label>Plan</label><div class="row seg" id="pl"><button data-v="1" class="on">Pro</button><button data-v="2">Max</button></div>
<label>Kitne din</label><div class="row chips" id="dc"><button data-v="7">7</button><button data-v="30" class="on">30</button><button data-v="90">90</button><button data-v="180">180</button><button data-v="365">365</button></div>
<label for="dn">Ya apne din likhein (1 se 3650)</label><input type="number" id="dn" inputmode="numeric" min="1" max="3650" placeholder="jaise 45">
<button class="go" id="give">Plan free karein</button><div class="msg" id="gm"></div>
<p class="sub" style="margin:8px 0 0">Same plan chalu ho to din uske upar jud jate hain. Paid plan ko ye chhedta nahi.</p>
</div>
<div class="card"><div class="row" style="align-items:center"><b style="flex:1">Diye hue plans (chalu)</b><button class="ghost" id="rf" style="flex:0 0 auto">Refresh</button></div><div id="ls" style="margin-top:6px"></div></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
const $=id=>document.getElementById(id);
const say=(el,t,c)=>{el.textContent=t;el.className="msg "+(c||"")};
let tier=1,days=30,PW="";try{PW=sessionStorage.getItem("ntak")||""}catch(e){}
const app=initializeApp({apiKey:"AIzaSyC8WKQfO8HpP-NlY3JVWO_GnI6qRHfDfd8",authDomain:"neurotriageweb.firebaseapp.com",projectId:"neurotriageweb",appId:"1:307869725639:web:a7d4be0895d6da71809fe2"});
const auth=getAuth(app);
async function api(path,method,body){
  const t=await auth.currentUser.getIdToken();
  const r=await fetch("/v1"+path+"?_="+Date.now(),{method:method||"GET",cache:"no-store",headers:{Authorization:"Bearer "+t,"X-Admin-Key":PW,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||("server error "+r.status));e.status=r.status;throw e}return j}
const fd=ms=>new Date(ms).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function pick(box,cb){$(box).onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$(box).children].forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(+b.dataset.v)}}
pick("pl",v=>tier=v);pick("dc",v=>{days=v;$("dn").value=""});
$("dn").oninput=()=>{if($("dn").value){days=+$("dn").value;[...$("dc").children].forEach(x=>x.classList.remove("on"))}};
function show(n){["s1","s2","panel"].forEach(x=>$(x).classList.toggle("hid",x!==n))}

fetch("/v1/billing/health?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(j.adminApi)say($("sv"),"Server theek hai (admin API chalu).","ok");
  else say($("sv"),"Server purana hai: naya _core.js GitHub par upload karke Vercel deploy hone dein.","er")
}).catch(()=>say($("sv"),"Server se baat nahi ho pa rahi. Internet ya Vercel deploy check karein.","er"));

$("gl").onclick=async()=>{say($("e1"),"");const p=new GoogleAuthProvider();try{p.setCustomParameters({prompt:"select_account"})}catch(e){}
  try{await signInWithPopup(auth,p)}catch(e){const c=e&&e.code||"";
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){say($("e1"),"Google page par ja rahe hain...");try{await signInWithRedirect(auth,p)}catch(x){say($("e1"),"Login nahi hua: "+(x.code||x.message),"er")}}
    else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")say($("e1"),"Login nahi hua: "+(c||e.message),"er")}};
async function enter(){say($("e2"),"Check ho raha hai...");$("pg").disabled=true;
  try{const j=await api("/admin/me");$("who2").textContent=j.email;show("panel");load()}
  catch(e){
    if(e.status===403&&/not admin/i.test(e.message)){await signOut(auth);show("s1");say($("e1"),"Ye account admin nahi hai.","er")}
    else{try{sessionStorage.removeItem("ntak")}catch(x){}PW="";show("s2");say($("e2"),e.message,"er")}}
  $("pg").disabled=false}
$("pg").onclick=()=>{PW=$("pw").value;if(!PW)return say($("e2"),"Password likhein.","er");try{sessionStorage.setItem("ntak",PW)}catch(e){}enter()};
$("so1").onclick=$("so").onclick=async()=>{try{sessionStorage.removeItem("ntak")}catch(e){}PW="";$("pw").value="";await signOut(auth)};
onAuthStateChanged(auth,u=>{if(!u){show("s1");return}$("who").textContent=u.email;show("s2");if(PW)enter()});

async function load(){const box=$("ls");box.textContent="Load ho raha hai...";
  try{const j=await api("/admin/list");box.textContent="";
    if(!j.items.length){box.textContent="Abhi koi free plan chalu nahi hai.";return}
    j.items.forEach(x=>{const d=document.createElement("div");d.className="it";
      const i=document.createElement("div");i.className="i";const b=document.createElement("b");b.textContent=x.email;
      const s=document.createElement("span");s.textContent=fd(x.exp)+" tak ("+Math.max(0,Math.ceil((x.exp-Date.now())/864e5))+" din baaki)";i.append(b,s);
      const t=document.createElement("span");t.className="tag"+(x.tier===2?" t2":"");t.textContent=x.tier===2?"Max":"Pro";
      const r=document.createElement("button");r.className="ghost";r.textContent="Hatao";
      r.onclick=async()=>{if(!confirm(x.email+" ka free plan hatayein?"))return;r.disabled=true;
        try{await api("/admin/revoke","POST",{email:x.email});load()}catch(e){alert(e.message);r.disabled=false}};
      d.append(i,t,r);box.append(d)})}
  catch(e){box.textContent=e.message}}
$("rf").onclick=load;
$("give").onclick=async()=>{const em=$("em").value.trim();if(!em)return say($("gm"),"Email likhein.","er");
  if(!(days>=1&&days<=3650))return say($("gm"),"Din 1 se 3650 ke beech likhein.","er");
  if(!confirm(em+"\n"+(tier===2?"Max":"Pro")+" - "+days+" din free?"))return;
  $("give").disabled=true;say($("gm"),"Ho raha hai...");
  try{const j=await api("/admin/grant","POST",{email:em,tier,days});say($("gm"),j.email+" ko "+j.plan+" mil gaya, "+fd(j.exp)+" tak.","ok");$("em").value="";load()}
  catch(e){say($("gm"),e.message,"er")}$("give").disabled=false};
</script></body></html>
